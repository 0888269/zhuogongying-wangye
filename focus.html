:700}.home-button{background:#dbe5f5;color:#252b33;font-size:21px}.agent-switch button:nth-child(1){background:#f6dff2;color:#db84cd}.agent-switch button:nth-child(2){background:#f6dddd;color:#df9292}.agent-switch button:nth-child(3){background:#f5e7db;color:#dfb27e}.agent-switch button.selected{outline:2px solid #1463ff;outline-offset:2px}.profile-button{margin-left:auto;background:transparent;color:#737980;font-size:20px;width:auto;min-width:68px;display:flex;gap:4px;white-space:nowrap}.bottom-label{display:inline;font-size:11px;color:#737980;text-align:left;margin-top:0}

    .focus-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--gap);padding-top:28px}.zone{min-height:350px;border-top:4px solid var(--ink);display:flex;flex-direction:column}.zone.red{border-color:var(--red)}.zone-head{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 20px;border-bottom:1px solid var(--color-border-list)}.zone-title{font-size:24px;font-weight:700;letter-spacing:-.04em}.zone-no{font:700 11px/1 monospace;color:var(--red)}

    /* Viewport-fit Focus layout: one Chrome 100% screen, no page scrolling. */
    html,body{height:100%;overflow:hidden}
    .shell{height:100vh;min-height:0;grid-template-rows:1fr}
    .side{height:100vh;min-height:0;overflow:hidden}
    main{height:100vh;min-height:0;display:flex;flex-direction:column;overflow:hidden}

    .zone{min-height:0;overflow:hidden}.zone-head{padding:11px 0 13px}.zone-title{font-size:20px}.task{padding:11px 0;font-size:14px}.zone-note{padding:12px;font-size:13px}.timer{padding-top:14px}.clock{font-size:34px}
    footer{margin-top:18px;padding-top:10px;flex:0 0 auto}
    @media(max-width:850px){html,body{overflow:auto}.shell,main{height:auto;min-height:100vh;overflow:visible}.side{height:auto}.content{height:auto;overflow:visible;padding:38px 22px 54px}.hero{grid-template-columns:1fr;padding-bottom:38px}.focus-grid{display:grid;flex:initial}.zone{min-height:0;overflow:visible}}
    /* Swiss system: one red accent, black rules, white field, restrained geometry. */
    :root{--color-primary:#1463ff}
    /* Blue brand trial: #1463ff, matching the interface accent and the logo's cool tone. */
    .eyebrow,.zone-no{color:var(--color-text-heading)}
    .zone.red{border-color:var(--color-border-strong)}
    .hermes-tabs button.active{border-bottom-color:var(--color-border-strong)}
    .hermes-menu button:hover,.hermes-menu button:focus{color:var(--color-text-heading)}
    .hermes-menu button:before{color:var(--color-text-secondary)}
    .home-button{background:var(--color-primary)!important;border:1px solid var(--color-primary);color:var(--color-button-primary-text)!important}
    .agent-switch button.selected{outline-color:var(--color-border-strong)}
    .profile-button:hover{color:var(--color-text-heading)}
    .task input:checked{background:var(--color-border-strong);border-color:var(--color-border-strong)}
    /* Agent workbench: sessions and skills are the primary surfaces. */
    .workbench{height:100%;display:grid;grid-template-rows:58px 1fr;min-width:0;background:#fff}
    .workbar{border-bottom:1px solid var(--color-border-strong);display:flex;align-items:center;gap:18px;padding:0 26px}.workbar-title{font-size:15px;font-weight:700;letter-spacing:-.02em}.workbar-path{font-size:12px;color:var(--color-text-secondary)}.workbar-spacer{flex:1}.workbar-action{border:0;background:none;color:var(--color-text-secondary);font-size:13px;padding:8px}.workbar-action:hover{color:var(--color-primary)}
    .workspace{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 250px}.session-panel,.skill-panel{min-width:0;background:#fafafa;padding:20px}.session-panel{border-right:1px solid var(--color-border-section)}.skill-panel{border-left:1px solid var(--color-border-section)}
    .panel-kicker{font-size:10px;line-height:1;letter-spacing:.12em;text-transform:uppercase;color:var(--color-text-secondary);font-weight:700;margin-bottom:14px}.panel-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.panel-heading h2{font-size:18px;letter-spacing:-.04em;margin:0}.panel-heading button{width:28px;height:28px;border:1px solid var(--color-border-strong);background:#fff;font-size:18px;line-height:1}
    .session-search{width:100%;border:1px solid var(--color-border-list);background:#fff;padding:9px 10px;font:13px var(--font-family-base);margin-bottom:14px}.session-list{display:grid;gap:4px}.session-item{border:1px solid transparent;background:transparent;text-align:left;padding:12px 10px;display:block;width:100%}.session-item:hover{border-color:var(--color-border-list);background:#fff}.session-item.active{border-color:var(--color-border-strong);background:#fff}.session-item strong{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session-item small{display:block;color:var(--color-text-secondary);font-size:11px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session-mark{display:inline-block;width:6px;height:6px;background:var(--color-primary);margin-right:7px;vertical-align:middle}
    .agent-canvas{min-width:0;min-height:0;display:grid;grid-template-rows:1fr auto;padding:30px 34px 24px}.canvas-head{display:flex;justify-content:space-between;align-items:start;border-bottom:1px solid var(--color-border-strong);padding-bottom:20px}.canvas-head h1{font-size:clamp(30px,3.7vw,54px);line-height:.96;letter-spacing:-.07em;margin:8px 0 10px;max-width:none}.canvas-head p{margin:0;color:var(--color-text-secondary);font-size:14px}.agent-state{font-size:11px;color:var(--color-text-secondary);white-space:nowrap;padding-top:8px}.agent-state i{display:inline-block;width:7px;height:7px;background:#2e8b57;margin-right:6px}

    .skill-list{display:grid;gap:8px}.skill-card{border:1px solid var(--color-border-list);background:#fff;padding:13px 12px;text-align:left}.skill-card:hover{border-color:var(--color-border-strong)}.skill-card strong{display:block;font-size:13px}.skill-card span{display:block;color:var(--color-text-secondary);font-size:11px;line-height:1.4;margin-top:5px}.skill-card em{display:inline-block;color:var(--color-primary);font-style:normal;font-size:10px;margin-top:9px}.skill-footer{border-top:1px dotted var(--color-border-list);margin-top:18px;padding-top:14px;color:var(--color-text-secondary);font-size:11px;line-height:1.6}

<body>

      <div class="hermes-side"><div><div class="hermes-brand"><img src="static/zhuogongying/club-logo.png" alt="卓工营 Logo"><span>医工卓工营</span></div><div class="hermes-tabs"><button class="active">会话</button><button>论坛</button></div><div class="hermes-menu"><button>新建会话</button><button>技能与工具</button><button>消息平台</button><button>搜索会话…</button></div><div class="history"><div class="history-title">会话历史</div><button class="history-item active" data-session="健康云 API 连通">健康云 API 连通</button><button class="history-item" data-session="前端界面重构">前端界面重构</button><button class="history-item" data-session="学生课程设计">学生课程设计</button></div></div><div class="hermes-bottom"><button class="home-button" title="回到主页">⌂</button><button class="profile-button" title="个人中心">♙<span class="bottom-label">个人中心</span></button></div></div>

  <script>
    document.querySelectorAll('.history-item').forEach(item=>item.addEventListener('click',()=>{
      document.querySelector('.history-item.active')?.classList.remove('active');
      item.classList.add('active');
      document.querySelector('#workbench-title').textContent=item.dataset.session;
    }));
  </script>
