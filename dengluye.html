<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登陆页</title>
  <link rel="icon" type="image/png" href="static/zhuogongying/club-logo.png">
  <style>
    :root {
      --font-family-base:
        'Inter', -apple-system, BlinkMacSystemFont,
        'Helvetica Neue', sans-serif;
      --color-primary: #e4312b;
      --color-bg-main: #ffffff;
      --color-text-heading: #000000;
      --color-border-strong: #111111;
      --ecg-red: var(--color-primary);
      --band-height: 11.111vh;
      /* 波形连续衔接，避免滚动过程中出现大面积空白 */
      --beat-gap: 0px;
      --edge-shift: calc(17vh - 8px);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      /* 中部明亮、上下较深的纵向渐变 */
      background: linear-gradient(
        to bottom,
        #f7f7f7 0%,
        #fcfcfc 18%,
        #ffffff 50%,
        #fcfcfc 82%,
        #f7f7f7 100%
      );
      font-family: var(--font-family-base);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 50% 48%, rgba(255, 255, 255, .58), transparent 54%);
    }

    .ecg-stage {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(24px, 4vh, 48px);
    }

    .grid-field {
      position: absolute;
      z-index: 0;
      left: -8vw;
      width: 116vw;
      height: 32vh;
      pointer-events: none;
      opacity: .28;
      background-image:
        repeating-linear-gradient(90deg, transparent 0 46px,
          rgba(17, 17, 17, .2) 47px 48px),
        repeating-linear-gradient(0deg, transparent 0 28px,
          rgba(17, 17, 17, .2) 29px 30px);
      -webkit-mask-image: radial-gradient(ellipse 76% 90% at 50% 50%,
        transparent 0%, rgba(0,0,0,.16) 38%, #000 78%, transparent 100%);
      mask-image: radial-gradient(ellipse 76% 90% at 50% 50%,
        transparent 0%, rgba(0,0,0,.16) 38%, #000 78%, transparent 100%);
      transform: perspective(360px) rotateX(62deg) scale(1.25);
      transform-origin: center center;
    }

    .grid-field::after {
      content: "";
      position: absolute;
      inset: -12%;
      border-radius: 50%;
      border: 1px solid rgba(17, 17, 17, .16);
      box-shadow: 0 0 35px rgba(17, 17, 17, .06);
    }

    .grid-field--top { top: -17vh; }
    .grid-field--bottom {
      bottom: -17vh;
      transform: perspective(360px) rotateX(-62deg) scale(1.25);
    }

    .hero-title,
    .ecg-window,
    .choice-actions { z-index: 1; }

    .hero-intro { text-align: center; }

    .hero-intro,
    .ecg-window,
    .choice-actions {
      transition: transform .8s cubic-bezier(.22, 1, .36, 1);
    }

    .ecg-stage.stage--moved .hero-intro {
      transform: translateY(calc(-1 * var(--edge-shift)));
    }

    .ecg-stage.stage--moved .ecg-window,
    .ecg-stage.stage--moved .choice-actions {
      transform: translateY(var(--edge-shift));
    }

    .login-fields {
      position: absolute;
      z-index: 2;
      top: 50%;
      left: 50%;
      width: min(360px, 72vw);
      display: grid;
      gap: 22px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -42%);
      transition: opacity .65s ease, transform .8s cubic-bezier(.22, 1, .36, 1);
    }

    .ecg-stage.stage--moved .login-fields {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%);
    }

    .login-line {
      width: 100%;
      padding: 8px 2px 10px;
      border: 0;
      border-bottom: 1px solid #b5b5b5;
      border-radius: 0;
      outline: none;
      background: transparent;
      color: var(--color-text-heading);
      font: 400 17px/1.4 var(--font-family-base);
      transition: border-color .2s ease, color .2s ease;
    }

    .login-line::placeholder { color: #b5b5b5; opacity: 1; }

    .login-line:focus,
    .login-line:not(:placeholder-shown) {
      border-bottom-color: var(--color-border-strong);
      color: var(--color-text-heading);
    }

    .hero-kicker {
      margin: 0 0 14px;
      color: var(--color-primary);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    .hero-title {
      margin: 0;
      color: var(--color-text-heading);
      font-size: clamp(32px, 5vw, 72px);
      font-weight: 700;
      letter-spacing: .08em;
      line-height: 1;
      text-align: center;
    }

    .hero-subtitle {
      margin: 14px 0 0;
      color: #7a7a7a;
      font-size: 14px;
      letter-spacing: .12em;
    }

    .choice-actions {
      display: flex;
      justify-content: center;
      gap: clamp(14px, 2vw, 28px);
    }

    .choice-button {
      min-width: clamp(132px, 14vw, 190px);
      padding: 14px 26px;
      border: 1px solid var(--color-border-strong);
      border-radius: 999px;
      background: var(--color-bg-main);
      color: var(--color-text-heading);
      font: 500 15px/1 var(--font-family-base);
      cursor: pointer;
      transition: color .25s ease, background-color .25s ease,
        transform .25s ease, box-shadow .25s ease;
      animation: button-breathe 3s ease-in-out infinite;
    }

    .choice-button:nth-child(2) { animation-delay: -1.5s; }

    .choice-button.is-selected {
      color: #fff;
      background: var(--color-primary);
      border-color: var(--color-primary);
    }

    .choice-button:hover,
    .choice-button:focus-visible {
      outline: none;
      color: #fff;
      background: var(--color-primary);
      border-color: var(--color-primary);
      box-shadow: 0 8px 24px rgba(228, 49, 43, .22);
      transform: translateY(-4px);
    }

    @keyframes button-breathe {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .ecg-window {
      width: 100vw;
      height: var(--band-height);
      overflow: hidden;
      position: relative;
    }

    .ecg-track {
      position: relative;
      height: 100%;
      width: max-content;
      display: flex;
      align-items: center;
      animation: sweep 5.5s linear infinite;
      will-change: transform;
    }

    .ecg-beat {
      flex: 0 0 100vw;
      width: 100vw;
      height: 100%;
      display: block;
    }

    .ecg-beat + .ecg-beat {
      margin-left: 0;
    }

    .ecg-line {
      fill: none;
      stroke: var(--ecg-red);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      filter: none;
    }

    .ecg-glow-outer,
    .ecg-glow-inner { stroke: var(--ecg-red); stroke-width: 5; }

    @keyframes sweep {
      from { transform: translateX(0); }
      to { transform: translateX(-100vw); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ecg-track { animation-duration: 12s; }
    }
  </style>
</head>
<body>
  <main class="ecg-stage" aria-label="医工卓工营入口">
    <div class="grid-field grid-field--top" aria-hidden="true"></div>
    <div class="grid-field grid-field--bottom" aria-hidden="true"></div>
    <div class="hero-intro">
      <p class="hero-kicker">MEDICAL × ENGINEERING</p>
      <h1 class="hero-title">医工卓工营</h1>
      <p class="hero-subtitle">连接医学与工程，开启实践学习</p>
    </div>
    <form class="login-fields" aria-label="登录信息">
      <input class="login-line" type="text" autocomplete="username" placeholder="账号">
      <input class="login-line" type="password" autocomplete="current-password" placeholder="密码">
    </form>
    <div class="ecg-window">
      <div class="ecg-track">
        <!-- 两个心电图形之间的间距 = 动画高度的 16 倍 -->
        <svg class="ecg-beat" viewBox="0 0 600 100" preserveAspectRatio="none" aria-hidden="true">
          <path class="ecg-line ecg-glow-outer" d="M0 50 L210 50 L228 46 L246 54 L262 50 L284 50 L300 12 L312 88 L324 30 L338 50 L362 50 L380 44 L398 56 L416 50 L600 50" />
          <path class="ecg-line ecg-glow-inner" d="M0 50 L210 50 L228 46 L246 54 L262 50 L284 50 L300 12 L312 88 L324 30 L338 50 L362 50 L380 44 L398 56 L416 50 L600 50" />
          <path class="ecg-line" d="M0 50 L210 50 L228 46 L246 54 L262 50 L284 50 L300 12 L312 88 L324 30 L338 50 L362 50 L380 44 L398 56 L416 50 L600 50" />
        </svg>
        <svg class="ecg-beat" viewBox="0 0 600 100" preserveAspectRatio="none" aria-hidden="true">
          <path class="ecg-line ecg-glow-outer" d="M0 50 L210 50 L228 46 L246 54 L262 50 L284 50 L300 12 L312 88 L324 30 L338 50 L362 50 L380 44 L398 56 L416 50 L600 50" />
          <path class="ecg-line ecg-glow-inner" d="M0 50 L210 50 L228 46 L246 54 L262 50 L284 50 L300 12 L312 88 L324 30 L338 50 L362 50 L380 44 L398 56 L416 50 L600 50" />
          <path class="ecg-line" d="M0 50 L210 50 L228 46 L246 54 L262 50 L284 50 L300 12 L312 88 L324 30 L338 50 L362 50 L380 44 L398 56 L416 50 L600 50" />
        </svg>
      </div>
    </div>
    <nav class="choice-actions" aria-label="身份选择">
      <button class="choice-button" type="button" data-mode="student" data-label="我是学生" data-active-label="学生登录" data-target="https://www.bilibili.com/">我是学生</button>
      <button class="choice-button" type="button" data-mode="admin" data-label="我是管理员" data-active-label="管理员登录" data-target="https://www.douyin.com/">我是管理员</button>
    </nav>
  </main>
  <script>
    document.querySelectorAll('.choice-button').forEach((button) => {
      button.addEventListener('click', () => {
        const stage = document.querySelector('.ecg-stage');
        const fields = stage.querySelectorAll('.login-line');
        const selected = button.classList.contains('is-selected');
        const isStudent = button.dataset.mode === 'student';

        if (selected) {
          window.location.href = button.dataset.target;
          return;
        }

        document.querySelectorAll('.choice-button').forEach((item) => {
          item.classList.remove('is-selected');
          item.textContent = item.dataset.label;
        });

        button.classList.add('is-selected');
        button.textContent = button.dataset.activeLabel;
        fields[0].placeholder = isStudent ? '学生账号' : '管理员账号';
        fields[1].placeholder = '密码';
        stage.classList.add('stage--moved');
      });
    });
  </script>
</body>
</html>
