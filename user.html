<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户名片</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            max-width: 400px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            position: relative;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px 20px;
            text-align: center;
            color: white;
        }
        
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            object-fit: cover;
            margin-bottom: 15px;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .subtitle {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .content {
            padding: 20px;
        }
        
        .card {
            background-color: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        
        .card h2 {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .card-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            color: #333;
            font-size: 14px;
        }
        
        .card-item i {
            width: 20px;
            color: #667eea;
            margin-right: 10px;
        }
        
        .card-item a {
            color: #667eea;
            text-decoration: none;
            word-break: break-all;
        }
        
        .card-item a:hover {
            text-decoration: underline;
        }
        
        .quote {
            font-style: italic;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-top: 15px;
        }
        
        .bio {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .badges-section {
            background-color: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .badges-section h2 {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .badges {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        
        .badge {
            background-color: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px 10px;
            text-align: center;
            transition: all 0.3s ease;
        }
        
        .badge.unlocked {
            border-color: #ffd700;
            background: linear-gradient(135deg, #fff9e6 0%, #fff 100%);
        }
        
        .badge.locked {
            background-color: #f5f5f5;
            border-color: #ccc;
            opacity: 0.6;
        }
        
        .badge i {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .badge.unlocked i {
            color: #ffd700;
        }
        
        .badge.locked i {
            color: #999;
        }
        
        .badge h3 {
            font-size: 12px;
            margin-bottom: 3px;
            color: #333;
        }
        
        .badge p {
            font-size: 10px;
            color: #666;
            margin: 0;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .action-button {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }
        
        .contact-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }
        
        .contact-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
        }
        
        .wechat-btn {
            background: linear-gradient(135deg, #07c160 0%, #06ad56 100%);
            color: white;
        }
        
        .wechat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(7, 193, 96, 0.3);
        }
        
        .feishu-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            color: white;
        }
        
        .feishu-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
        }
        
        .action-button i {
            font-size: 20px;
            margin-bottom: 5px;
            display: block;
        }
        
        .badges-toggle {
            text-align: center;
            margin-top: 10px;
            padding: 8px;
            color: #667eea;
            font-size: 13px;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        
        .badges-toggle:hover {
            background-color: rgba(102, 126, 234, 0.1);
        }
        
        .badges-toggle i {
            transition: transform 0.3s ease;
        }
        
        .badges-toggle.expanded i {
            transform: rotate(180deg);
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            background-color: #f8f9fa;
            color: #666;
            font-size: 12px;
        }
        
        .footer a {
            color: #667eea;
            text-decoration: none;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #333;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                border-radius: 0;
                height: 100vh;
                overflow-y: auto;
            }
            
            .badges {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
<link rel="stylesheet" href="/styles.css">
<script src="/ui.js"></script>
<link rel="icon" type="image/png" href="/club-logo.png">
<link rel="stylesheet" href="/growth.css">
<link rel="stylesheet" href="/contact.css"><script src="/contact-ui.js"></script><script src="/collaboration-ui.js"></script>
<script src="/growth-catalog.js"></script>
<script src="/api-client.js"></script>
<script src="/medal-art.js"></script>
<script src="/growth-ui.js"></script>
<link rel="stylesheet" href="/cabinet.css">
<script defer src="/badge-cabinet.js"></script>
</head>
<body class="public-page">
    <nav class="public-nav"><a class="brand" href="/"><img class="club-logo" src="/club-logo.png" alt="医工融合卓越工程师协会标志"><span>医工名片</span></a><a class="manage-link" href="/">管理我的名片 ↗</a></nav>
    <div class="container">
        <section class="header member-hero" aria-label="Club profile">
            <div class="member-identity">
                <img id="profile-img" src="/avatar.svg" alt="Profile photo" class="profile-img">
                <div class="member-heading">
                    <span class="eyebrow">MY CLUB PROFILE</span>
                    <h1 id="user-name"></h1>
                    <p id="user-title" class="subtitle"></p>
                </div>
            </div>
            <div class="hero-stat"><span class="hero-stat-label">已点亮徽章</span><strong id="hero-badge-count">0 <small>/ 0</small></strong><span id="member-growth-rank">成长起点</span></div>
        </section>

        <div class="content">
            <div class="card">
                <h2><i class="fas fa-user-tie"></i> 个人信息</h2>
                <div class="card-item hidden" id="public-gender-item"><i class="fas fa-user" aria-hidden="true"></i><span id="public-gender"></span></div>
                <div class="card-item">
                    <i class="fas fa-graduation-cap"></i>
                    <span id="user-major"></span>
                </div>
                <div class="card-item">
                    <i class="fas fa-building"></i>
                    <span id="user-organization"></span>
                </div>
                <div class="card-item">
                    <i class="fas fa-envelope"></i>
                    <a id="user-email" href=""></a>
                </div>
                <div class="card-item">
                    <i class="fab fa-github"></i>
                    <a id="user-github" href="" target="_blank" rel="noopener noreferrer"></a>
                </div>

                <p id="user-quote" class="quote"></p>
            </div>
            
            <div class="card">
                <h2><i class="fas fa-user"></i> 个人简介</h2>
                <p id="user-bio" class="bio"></p>
            </div>
            
            <section id="public-growth-wall" class="badge-wall"></section>
            <section class="profile-resources" aria-label="名片相关入口">
                <details class="public-route-details"><summary>成长路线 <span aria-hidden="true">＋</span></summary><div id="public-growth-route"></div></details>
                <section id="public-contact-tools"></section>
                <section id="public-collaboration"></section>
            </section>
        </div>
        
        <div class="footer">
            <p>深圳大学医工融合卓越工程师协会</p>
            <p><a href="/index.html">返回首页</a></p>
        </div>
    </div>
    
    <script>
        // 从服务器注入的用户数据
        const userData = __USER_DATA__;
        
        // 加载用户数据
        function loadUserData() {
            if (!userData) {
                showNotification('错误', '无法加载用户数据');
                return;
            }
            
            document.getElementById('profile-img').src = userData.avatar;
            document.getElementById('user-name').textContent = userData.name;
            document.title = (userData.name || '个人') + ' · 医工名片';
            document.getElementById('user-title').textContent = userData.title;
            document.getElementById('user-major').textContent = userData.major;
            document.getElementById('public-gender-item').classList.toggle('hidden',!userData.gender);
            document.getElementById('public-gender').textContent=userData.gender?'性别：'+userData.gender:'';
            document.getElementById('user-organization').textContent = userData.organization;
            document.getElementById('user-email').textContent = userData.email;
            document.getElementById('user-email').href = 'mailto:' + userData.email;
            document.getElementById('user-github').textContent = userData.github;
            document.getElementById('user-github').href = safeWebUrl(userData.github);
            document.getElementById('user-quote').textContent = '"' + userData.quote + '"';
            document.getElementById('user-bio').textContent = userData.bio;
            
            // 加载图鉴（带折叠）

            GrowthUI.render(userData);
            ContactUI.mount(document.getElementById('public-contact-tools'),userData);
            
            CollaborationUI.load(document.getElementById('public-collaboration'),true);

            // 记录访客
            // Visitor recording is omitted until a matching API is available.
        }
        
        // 记录访客
        function recordVisitor(userId) {
            fetch('/api/visitors', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    userId: userId,
                    method: 'URL访问'
                })
            }).then(response => response.json())
            .then(data => {
                console.log('访客记录已保存');
            }).catch(error => {
                console.error('保存访客记录失败:', error);
            });
        }
        
        // 显示通知
        function showNotification(title, message) {
            const notification = document.createElement('div');
            notification.className = 'notification';
            notification.setAttribute('role', 'status');
            notification.textContent = title + '：' + message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 3000);
        }
        
        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', loadUserData);
    </script>
</body>
</html>
